[package]
name = "dbdog"
version = "0.1.0"
description = "DBDog - Cross-platform database GUI tool"
authors = ["DBDog Team"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "dbdog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "json", "chrono", "bigdecimal"] }
dashmap = "6"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
