name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build ${{ matrix.platform }} ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: default
            args: ""
          - platform: windows-latest
            target: portable
            args: --no-bundle

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e 'const fs=require("fs");
          const expected=process.env.RELEASE_TAG.replace(/^v/,"");
          const packageVersion=JSON.parse(fs.readFileSync("package.json","utf8")).version;
          const cargoVersion=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (packageVersion!==expected || cargoVersion!==expected) {
            console.error("Release tag "+process.env.RELEASE_TAG+" does not match package.json ("+packageVersion+") and src-tauri/Cargo.toml ("+cargoVersion+").");
            process.exit(1);
          }'

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DBDog ${{ github.ref_name }}
          releaseBody: |
            Download the installer or package for your platform from the assets below.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
